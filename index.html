<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>منصّة القبض · الدفع الإلكتروني الموحّد</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1A1B;
    --bg-soft:#112625;
    --surface:#15302E;
    --paper:#FBF7EE;
    --paper-dim:#F1EBDA;
    --ink:#12201F;
    --teal:#12977C;
    --teal-deep:#0B6E5A;
    --amber:#E1A253;
    --muted:#93A9A4;
    --muted-dark:#5C6E6A;
    --line:rgba(251,247,238,0.14);
    --line-strong:rgba(251,247,238,0.28);
    --danger:#D1583F;
    --radius:18px;
    --radius-sm:10px;
    --ease:cubic-bezier(.4,0,.2,1);
    --sbw:288px;
    --hh:68px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--paper);
    direction:rtl;
    height:100vh;
    height:100dvh;
    width:100%;
    max-width:100vw;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;direction:ltr;display:inline-block;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;}

  .app{
    display:flex;height:100vh;height:100dvh;overflow:hidden;max-width:100vw;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  }

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:var(--sbw);min-width:var(--sbw);
    background:linear-gradient(180deg,#0A1615,#0D1F1D 55%,#0A1615);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;
    transition:width .3s var(--ease),min-width .3s var(--ease),margin-right .3s var(--ease);
    position:relative;z-index:100;
  }
  .sidebar.hidden{margin-right:calc(var(--sbw) * -1);min-width:0;width:0;}

  .brand{padding:22px 22px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .brand-seal{
    width:42px;height:42px;border-radius:50%;
    border:2px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Almarai',sans-serif;font-weight:800;font-size:14px;color:var(--amber);
    position:relative;flex-shrink:0;
  }
  .brand-seal::after{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1px dashed rgba(225,162,83,0.45);
  }
  .brand-title{font-family:'Almarai',sans-serif;font-weight:800;font-size:16px;color:var(--paper);letter-spacing:.3px;}
  .brand-sub{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}

  .sidebar-menu{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 10px;}
  .menu-label{
    font-size:10px;color:var(--muted-dark);text-transform:uppercase;
    letter-spacing:1.8px;padding:14px 10px 6px;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  .menu-label::after{content:'';flex:1;height:1px;background:var(--line);}
  .menu-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
    color:rgba(251,247,238,0.68);font-weight:500;font-size:13.5px;
    transition:background .2s var(--ease),color .2s var(--ease);
    cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;
    text-align:right;font-family:'Cairo',sans-serif;position:relative;
  }
  .menu-item:hover{background:rgba(251,247,238,0.06);color:var(--paper);}
  .menu-item.active{background:rgba(18,151,124,0.22);color:var(--paper);}
  .menu-item.active::before{
    content:'';position:absolute;right:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--teal);
  }
  .menu-item i{width:18px;text-align:center;font-size:13px;color:var(--teal);}
  .menu-item.active i{color:var(--amber);}

  .sidebar-footer{padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;gap:10px;}
  .sidebar-footer .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(18,151,124,0.25);}
  .sidebar-footer .txt div:first-child{font-weight:600;font-size:12.5px;}
  .sidebar-footer .txt div:last-child{font-size:10.5px;color:var(--muted);}

  /* ===== MAIN ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-soft);}

  .header{
    height:var(--hh);background:var(--surface);padding:0 22px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    border-bottom:1px solid var(--line);flex-shrink:0;z-index:50;
  }
  .header-left{display:flex;align-items:center;gap:14px;}
  .icon-btn{
    background:none;border:1px solid var(--line-strong);color:var(--paper);
    width:38px;height:38px;border-radius:10px;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.2s var(--ease);
  }
  .icon-btn:hover{background:rgba(251,247,238,0.08);border-color:var(--teal);}
  .header-title{font-family:'Almarai',sans-serif;font-weight:700;font-size:15px;}
  .header-title span{color:var(--amber);}

  .search-box{
    flex:1;min-width:0;max-width:460px;display:flex;align-items:center;gap:10px;
    background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:0 14px;
    transition:.2s var(--ease);
  }
  .search-box:focus-within{border-color:var(--teal);}
  .search-box i{color:var(--muted);font-size:13px;}
  .search-box input{
    border:none;background:none;padding:10px 0;font-size:13.5px;width:100%;outline:none;
    font-family:'Cairo',sans-serif;color:var(--paper);direction:rtl;
  }
  .search-box input::placeholder{color:var(--muted-dark);}
  .stat-pill{
    background:var(--bg-soft);border:1px solid var(--line);padding:7px 14px;border-radius:50px;
    font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .stat-pill i{color:var(--amber);}

  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 30px;max-width:100%;}

  /* ===== HERO / RECEIPT ===== */
  .hero{
    background:linear-gradient(120deg,var(--teal-deep),#0D4A3D 70%);
    border:1px solid rgba(225,162,83,0.25);
    border-radius:var(--radius);padding:34px 34px 28px;margin-bottom:28px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:'';position:absolute;left:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(225,162,83,0.18),transparent 70%);
  }
  .hero-eyebrow{
    font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:700;text-transform:uppercase;
    display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative;
  }
  .hero-eyebrow .mono{font-size:10.5px;color:rgba(251,247,238,0.6);}
  .hero h1{font-family:'Almarai',sans-serif;font-weight:800;font-size:27px;margin-bottom:8px;position:relative;line-height:1.4;}
  .hero p{font-size:14px;color:rgba(251,247,238,0.78);max-width:560px;position:relative;line-height:1.8;}
  .hero-stats{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;position:relative;}
  .hero-stat{
    background:rgba(251,247,238,0.08);border:1px dashed rgba(251,247,238,0.25);
    padding:12px 20px;border-radius:12px;min-width:110px;
  }
  .hero-stat .n{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--amber);}
  .hero-stat .l{font-size:11px;color:rgba(251,247,238,0.7);margin-top:2px;}

  /* ===== SECTION HEADERS ===== */
  .sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 14px;}
  .sec-head h2{font-family:'Almarai',sans-serif;font-weight:700;font-size:15.5px;color:var(--paper);}
  .sec-head .count{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
    border:1px solid var(--line);padding:2px 9px;border-radius:20px;
  }
  .sec-head::after{content:'';flex:1;height:1px;background:var(--line);}

  /* ===== SERVICE STUBS (signature element) ===== */
  .stub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .stub{
    background:var(--paper);color:var(--ink);border-radius:14px;
    display:flex;flex-direction:column;cursor:pointer;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.28);
    transition:transform .22s var(--ease),box-shadow .22s var(--ease);
    position:relative;border:1px solid var(--paper-dim);
  }
  .stub:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,0.4);}
  .stub-top{padding:16px 16px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .stub-icon{
    width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--service-color,var(--teal));color:#fff;font-size:15px;flex-shrink:0;
  }
  .stub-seal{
    width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--muted-dark);
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
    color:var(--muted-dark);font-family:'JetBrains Mono',monospace;flex-shrink:0;transform:rotate(-8deg);
  }
  .stub-name{font-family:'Almarai',sans-serif;font-weight:700;font-size:14.5px;padding:0 16px;line-height:1.5;}
  .stub-cat{font-size:10.5px;color:var(--muted-dark);padding:4px 16px 14px;}
  .stub-tear{
    position:relative;height:1px;border-top:1.5px dashed var(--paper-dim);margin:0 4px;
  }
  .stub-tear::before,.stub-tear::after{
    content:'';position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--bg-soft);
  }
  .stub-tear::before{right:-10px;}
  .stub-tear::after{left:-10px;}
  .stub-bottom{
    padding:11px 16px;display:flex;align-items:center;justify-content:space-between;
    font-size:11px;font-weight:600;color:var(--teal-deep);
  }
  .stub-bottom i{transition:transform .2s var(--ease);}
  .stub:hover .stub-bottom i{transform:translateX(-3px);}

  /* ===== CUSTOM LINKS ===== */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;margin-top:30px;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-title{font-family:'Almarai',sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px;}
  .panel-title i{color:var(--amber);}
  .btn{
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Cairo',sans-serif;border:none;transition:.2s var(--ease);display:flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-ghost{background:none;border:1px solid var(--line-strong);color:var(--paper);}
  .btn-ghost:hover{border-color:var(--teal);}

  .custom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .custom-item{
    display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-soft);
    border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;
    transition:.2s var(--ease);position:relative;
  }
  .custom-item:hover{border-color:var(--teal);background:rgba(18,151,124,0.1);}
  .custom-item i.link-i{color:var(--amber);}
  .custom-item .del{
    margin-right:auto;opacity:0;color:var(--danger);font-size:12px;transition:.15s;
  }
  .custom-item:hover .del{opacity:1;}

  .empty{text-align:center;padding:34px 20px;color:var(--muted);}
  .empty i{font-size:30px;margin-bottom:10px;opacity:.35;display:block;}
  .empty p{font-size:13px;}
  .empty .hint{font-size:11.5px;margin-top:4px;color:var(--muted-dark);}

  .footnote{text-align:center;color:var(--muted-dark);font-size:11.5px;padding:26px 0 10px;line-height:1.9;}

  /* ===== STATUS BAR ===== */
  .status-bar{
    background:#081413;color:rgba(251,247,238,0.65);padding:0 20px;height:30px;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;font-size:11px;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);height:calc(30px + env(safe-area-inset-bottom));
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;margin-left:6px;box-shadow:0 0 0 3px rgba(18,151,124,0.25);}

  /* ===== TOAST ===== */
  .toast{
    position:fixed;bottom:64px;right:22px;background:var(--surface);border:1px solid var(--line-strong);
    color:var(--paper);padding:13px 20px;border-radius:12px;font-size:13px;font-weight:500;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:1000;transform:translateX(130%);
    transition:transform .4s var(--ease);display:flex;align-items:center;gap:10px;max-width:340px;
  }
  .toast.show{transform:translateX(0);}

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(6,14,13,0.6);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease);
  }
  .modal-overlay.show{opacity:1;pointer-events:all;}
  .modal{
    background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;
    padding:26px 26px 22px;width:340px;max-width:90vw;transform:translateY(10px);transition:transform .2s var(--ease);
  }
  .modal-overlay.show .modal{transform:translateY(0);}
  .modal h3{font-family:'Almarai',sans-serif;font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .modal h3 i{color:var(--amber);}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .field input{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line-strong);
    background:var(--bg-soft);color:var(--paper);font-family:'Cairo',sans-serif;font-size:13px;outline:none;
  }
  .field input:focus{border-color:var(--teal);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;justify-content:center;}

  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s;}
  .sidebar-overlay.show{opacity:1;pointer-events:all;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeIn .35s var(--ease);}

  /* ===== TABLET / SMALL LAPTOP ===== */
  @media (max-width:1024px){
    :root{--sbw:240px;}
    .stub-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
    .hero{padding:28px 26px 24px;}
  }

  /* ===== MOBILE ===== */
  @media (max-width:768px){
    :root{--hh:58px;--sbw:78vw;}
    .sidebar{position:fixed;top:0;right:0;height:100vh;height:100dvh;max-width:320px;transform:translateX(100%);transition:transform .3s var(--ease);z-index:200;}
    .sidebar.open{transform:translateX(0);}
    .sidebar.hidden{margin-right:0;transform:translateX(100%);}
    .header{padding:0 14px;}
    .header-title{display:none;}
    .stat-pill{display:none;}
    .content{padding:16px;}
    .hero{padding:22px 18px;}
    .hero h1{font-size:19px;line-height:1.5;}
    .hero p{font-size:13px;}
    .hero-stat{padding:10px 16px;min-width:96px;}
    .stub-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .stub-name{font-size:12.5px;}
    .custom-grid{grid-template-columns:1fr 1fr;}
    /* iOS zooms the page in when a focused input has font-size below 16px */
    .search-box input,.field input{font-size:16px;}
    .toast{right:14px;left:14px;max-width:none;bottom:44px;}
    .modal{width:100%;max-width:340px;}
  }

  @media (max-width:420px){
    .stub-icon{width:32px;height:32px;font-size:13px;}
    .stub-seal{display:none;}
  }

  @media (max-width:360px){
    .stub-grid{grid-template-columns:1fr;}
    .custom-grid{grid-template-columns:1fr;}
    .hero h1{font-size:17px;}
    .hero-stats{gap:8px;}
    .brand{padding:18px 16px 14px;}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-seal">AR</div>
      <div>
        <div class="brand-title">منصّة القبض</div>
        <div class="brand-sub">الدفع الإلكتروني الموحّد</div>
      </div>
    </div>
    <nav class="sidebar-menu" id="sidebarMenu"></nav>
    <div class="sidebar-footer">
      <span class="dot"></span>
      <div class="txt">
        <div>الخدمة متصلة</div>
        <div>جلسة زائر</div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <div class="header-title">منصّة <span>القبض</span></div>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن مؤسسة أو خدمة…">
      </div>
      <div class="stat-pill"><i class="fas fa-layer-group"></i> <span id="svcCount">14</span> خدمة موحّدة</div>
    </header>

    <div class="content" id="content"></div>

    <div class="status-bar">
      <span><span class="status-dot"></span><span id="statusMessage">جاهز للاستخدام</span></span>
      <span class="mono" id="statusTime">00:00:00</span>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <i id="toastIcon" class="fas fa-check-circle" style="color:var(--teal)"></i>
  <span id="toastMessage">تم</span>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3><i class="fas fa-link"></i> إضافة رابط مخصص</h3>
    <div class="field">
      <label>اسم الخدمة</label>
      <input type="text" id="linkNameInput" placeholder="مثال: فاتورة الهاتف">
    </div>
    <div class="field">
      <label>الرابط</label>
      <input type="text" id="linkUrlInput" placeholder="example.com" dir="ltr" style="text-align:left;">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveCustomLink()"><i class="fas fa-check"></i> حفظ</button>
    </div>
  </div>
</div>

<script>
  // ==========================================================
  // DATA — grouped by real sector, not decoration
  // ==========================================================
  const CATEGORIES = [
    { key:'telecom', label:'الاتصالات والإنترنت', icon:'fa-tower-broadcast' },
    { key:'energy',  label:'الطاقة والمرافق',     icon:'fa-bolt' },
    { key:'housing', label:'السكن والعقار',        icon:'fa-building' },
    { key:'health',  label:'الصحة والتأمينات',     icon:'fa-briefcase-medical' },
    { key:'finance', label:'البنوك والمالية',       icon:'fa-university' },
    { key:'travel',  label:'السفر والحجوزات',       icon:'fa-plane' },
  ];

  const SERVICES = {
    ooredoo:            { name:'أوريدو', icon:'fa-mobile-alt', url:'https://estorm.ooredoo.dz/e-payment/payment/public/?lang=fr', color:'#D1583F', cat:'telecom', code:'OT' },
    djezzy:             { name:'جيزي', icon:'fa-phone', url:'https://moncompte.djezzy.dz/ar/guest/recharge', color:'#E1A253', cat:'telecom', code:'DJ' },
    mobilis:            { name:'موبيليس', icon:'fa-sim-card', url:'https://e-paiement.mobilis.dz/', color:'#2E6FA7', cat:'telecom', code:'MB' },
    'algierie-telecom':  { name:'اتصالات الجزائر', icon:'fa-phone-volume', url:'https://www.algerietelecom.dz/fr/paiement-en-ligne', color:'#B24C6B', cat:'telecom', code:'AT' },
    internet:           { name:'الإنترنت الثابت', icon:'fa-wifi', url:'https://paiement.at.dz/index.php?p=voucher_internet&produit=in', color:'#3A7CA5', cat:'telecom', code:'IN' },
    sonelgaz:           { name:'سونلغاز', icon:'fa-bolt', url:'https://www.sonelgaz.dz/fr/paiement-en-ligne', color:'#C77B33', cat:'energy', code:'SG' },
    ade:                { name:'الجزائرية للمياه', icon:'fa-droplet', url:'https://www.ade.dz/e-paiement/', color:'#2E8FA3', cat:'energy', code:'AD' },
    aadl:               { name:'AADL', icon:'fa-building', url:'https://aadlgestimmo.dz/epayement/View/index.php', color:'#12977C', cat:'housing', code:'AL' },
    'aadl-relogin':      { name:'AADL — تجديد الدخول', icon:'fa-key', url:'https://aadl.dz/relogin', color:'#0B6E5A', cat:'housing', code:'AR' },
    cnas:               { name:'صندوق الضمان (شافي)', icon:'fa-briefcase-medical', url:'https://elhanaa.cnas.dz/index.jsp', color:'#B0473F', cat:'health', code:'CN' },
    badr:               { name:'بنك الفلاحة BADR', icon:'fa-university', url:'https://www.badr.dz/epayment', color:'#3C8C5F', cat:'finance', code:'BD' },
    elit:               { name:'ELIT للدفع', icon:'fa-coins', url:'https://epayement.elit.dz/?lang=ar', color:'#B69440', cat:'finance', code:'EL' },
    airline:            { name:'الخطوط الجوية الجزائرية', icon:'fa-plane', url:'https://www.airalgerie.dz/fr/paiement-en-ligne', color:'#3E6FA6', cat:'travel', code:'AH' },
    adhahi:             { name:'حجز أضحيتي', icon:'fa-house-chimney', url:'https://adhahi.dz/auth/reservation', color:'#7A5C9E', cat:'travel', code:'AH' },
  };

  // in-memory only — no browser storage inside this preview
  let customLinks = [];
  let editingIndex = null;

  const el = id => document.getElementById(id);
  const content = el('content');

  // ==========================================================
  // SIDEBAR NAV
  // ==========================================================
  function buildSidebar(){
    let html = `<div class="menu-label"><i class="fas fa-house" style="color:var(--teal)"></i> نظرة عامة</div>
      <button class="menu-item active" data-service="home" onclick="showHome()"><i class="fas fa-house"></i> الرئيسية</button>`;
    CATEGORIES.forEach(cat=>{
      const items = Object.entries(SERVICES).filter(([,s])=>s.cat===cat.key);
      if(!items.length) return;
      html += `<div class="menu-label">${cat.label}</div>`;
      items.forEach(([key,s])=>{
        html += `<button class="menu-item" data-service="${key}" onclick="openService('${key}')"><i class="fas ${s.icon}"></i> ${s.name}</button>`;
      });
    });
    el('sidebarMenu').innerHTML = html;
  }

  function setActive(key){
    document.querySelectorAll('.menu-item').forEach(i=>i.classList.toggle('active', i.dataset.service===key));
  }

  // ==========================================================
  // TOAST
  // ==========================================================
  let toastTimer=null;
  function showToast(msg, icon='fa-check-circle', color='var(--teal)'){
    el('toastMessage').textContent = msg;
    const ic = el('toastIcon'); ic.className = `fas ${icon}`; ic.style.color = color;
    el('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el('toast').classList.remove('show'), 2800);
  }

  // ==========================================================
  // HOME
  // ==========================================================
  function catLabel(key){ return CATEGORIES.find(c=>c.key===key)?.label || ''; }

  function stubHTML(key, s){
    return `
      <div class="stub" style="--service-color:${s.color}" onclick="openService('${key}')">
        <div class="stub-top">
          <div class="stub-icon"><i class="fas ${s.icon}"></i></div>
          <div class="stub-seal">${s.code}</div>
        </div>
        <div class="stub-name">${s.name}</div>
        <div class="stub-cat">${catLabel(s.cat)}</div>
        <div class="stub-tear"></div>
        <div class="stub-bottom"><span>الدفع الآن</span><i class="fas fa-arrow-left"></i></div>
      </div>`;
  }

  function customLinkHTML(item, idx){
    return `
      <div class="custom-item" onclick="openCustomLink(${idx})">
        <i class="fas fa-link link-i"></i>
        <span>${item.name}</span>
        <i class="fas fa-trash del" onclick="event.stopPropagation(); deleteCustomLink(${idx})"></i>
      </div>`;
  }

  function showHome(){
    setActive('home');
    const now = new Date();
    const dateStr = now.toLocaleDateString('ar-DZ', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

    let servicesHTML = '';
    CATEGORIES.forEach(cat=>{
      const items = Object.entries(SERVICES).filter(([,s])=>s.cat===cat.key);
      if(!items.length) return;
      servicesHTML += `
        <div class="sec-head"><h2><i class="fas ${cat.icon}" style="color:var(--amber);margin-left:4px"></i> ${cat.label}</h2><span class="count mono">${String(items.length).padStart(2,'0')}</span></div>
        <div class="stub-grid">${items.map(([k,s])=>stubHTML(k,s)).join('')}</div>`;
    });

    const customHTML = customLinks.length
      ? `<div class="custom-grid">${customLinks.map((c,i)=>customLinkHTML(c,i)).join('')}</div>`
      : `<div class="empty"><i class="fas fa-link"></i><p>لا توجد روابط مخصّصة بعد</p><p class="hint">أضف اختصارًا لأي خدمة دفع تستخدمها بانتظام</p></div>`;

    content.innerHTML = `
      <div class="fade-in">
        <div class="hero">
          <div class="hero-eyebrow"><i class="fas fa-receipt"></i> إيصال الدخول <span class="mono">· ${dateStr}</span></div>
          <h1>ادفع فواتيرك الإدارية والاتصالات من مكان واحد</h1>
          <p>وصول مباشر إلى بوّابات الدفع الرسمية لمؤسسات الاتصالات والطاقة والسكن والبنوك في الجزائر — كل خدمة تُفتح في نافذتها الخاصة والآمنة.</p>
          <div class="hero-stats">
            <div class="hero-stat"><div class="n mono">${String(Object.keys(SERVICES).length).padStart(2,'0')}</div><div class="l">خدمة موحّدة</div></div>
            <div class="hero-stat"><div class="n mono">${String(CATEGORIES.length).padStart(2,'0')}</div><div class="l">قطاعات مغطّاة</div></div>
            <div class="hero-stat"><div class="n mono">${String(customLinks.length).padStart(2,'0')}</div><div class="l">رابط مخصّص</div></div>
          </div>
        </div>

        ${servicesHTML}

        <div class="panel">
          <div class="panel-head">
            <div class="panel-title"><i class="fas fa-star"></i> روابطي المخصّصة</div>
            <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> إضافة رابط</button>
          </div>
          ${customHTML}
        </div>

        <div class="footnote">
          منصّة القبض · دليل وصول إلى بوّابات الدفع الرسمية — لا تقوم المنصّة بمعالجة أي مدفوعات ولا تخزّن بيانات مصرفية.<br>
          الروابط المخصّصة محفوظة في هذه الجلسة فقط ولن تُحفظ بعد إغلاق الصفحة.
        </div>
      </div>`;
    el('statusMessage').textContent = 'الصفحة الرئيسية';
  }

  // ==========================================================
  // SERVICE PAGE
  // ==========================================================
  function openService(key){
    const s = SERVICES[key];
    if(!s) return;
    setActive(key);
    window.open(s.url, '_blank');
    showToast(`تم فتح ${s.name} في نافذة جديدة`, 'fa-arrow-up-right-from-square', 'var(--teal)');
    el('statusMessage').textContent = `تم فتح — ${s.name}`;

    content.innerHTML = `
      <div class="fade-in">
        <div class="hero" style="background:linear-gradient(120deg, ${s.color}dd, ${s.color}99)">
          <div class="hero-eyebrow"><i class="fas ${s.icon}"></i> بوّابة الدفع <span class="mono">· ${catLabel(s.cat)}</span></div>
          <h1>${s.name}</h1>
          <p>فُتحت بوّابة الدفع الرسمية في نافذة جديدة. إن لم تظهر النافذة، تأكد من السماح للنوافذ المنبثقة في المتصفح، أو أعد الفتح يدويًا أدناه.</p>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" style="padding:13px 26px" onclick="window.open('${s.url}','_blank')"><i class="fas fa-arrow-up-right-from-square"></i> إعادة فتح ${s.name}</button>
          <button class="btn btn-ghost" style="padding:13px 26px" onclick="showHome()"><i class="fas fa-house"></i> العودة إلى الرئيسية</button>
        </div>
      </div>`;
  }

  // ==========================================================
  // CUSTOM LINKS — modal based (no window.prompt)
  // ==========================================================
  function openModal(){
    editingIndex = null;
    el('linkNameInput').value = '';
    el('linkUrlInput').value = '';
    el('modalOverlay').classList.add('show');
    setTimeout(()=> el('linkNameInput').focus(), 50);
  }
  function closeModal(){ el('modalOverlay').classList.remove('show'); }

  function saveCustomLink(){
    const name = el('linkNameInput').value.trim();
    let url = el('linkUrlInput').value.trim();
    if(!name || !url){ showToast('يرجى إدخال الاسم والرابط', 'fa-triangle-exclamation', 'var(--danger)'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    customLinks.push({ name, url });
    closeModal();
    showToast(`تمت إضافة «${name}»`, 'fa-check-circle', 'var(--teal)');
    showHome();
  }

  function openCustomLink(idx){
    const item = customLinks[idx];
    if(!item) return;
    window.open(item.url, '_blank');
    showToast(`تم فتح «${item.name}»`, 'fa-arrow-up-right-from-square', 'var(--teal)');
  }

  function deleteCustomLink(idx){
    const item = customLinks[idx];
    if(!item) return;
    customLinks.splice(idx,1);
    showToast(`تم حذف «${item.name}»`, 'fa-trash', 'var(--danger)');
    showHome();
  }

  el('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

  // ==========================================================
  // SEARCH
  // ==========================================================
  el('searchInput').addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    document.querySelectorAll('.stub').forEach(card=>{
      const name = card.querySelector('.stub-name')?.textContent?.toLowerCase() || '';
      card.style.display = (q.length < 2 || name.includes(q)) ? '' : 'none';
    });
    document.querySelectorAll('.sec-head').forEach(head=>{
      const grid = head.nextElementSibling;
      if(!grid || !grid.classList.contains('stub-grid')) return;
      const anyVisible = [...grid.children].some(c => c.style.display !== 'none');
      head.style.display = anyVisible ? '' : 'none';
      grid.style.display = anyVisible ? '' : 'none';
    });
  });

  el('searchInput').addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    const q = this.value.trim();
    if(!q) return;
    const hit = Object.entries(SERVICES).find(([,s]) => s.name.includes(q));
    if(hit){ openService(hit[0]); this.value=''; return; }
    const custom = customLinks.findIndex(c => c.name.includes(q));
    if(custom > -1){ openCustomLink(custom); this.value=''; return; }
    showToast(`لم يتم العثور على «${q}»`, 'fa-circle-xmark', 'var(--danger)');
  });

  // ==========================================================
  // SIDEBAR TOGGLE
  // ==========================================================
  const sidebar = el('sidebar'), overlay = el('sidebarOverlay');
  const MOBILE_BP = 768;
  let isMobile = window.innerWidth <= MOBILE_BP;
  let sidebarOpen = !isMobile; // مفتوحة افتراضيًا على الحاسوب، مغلقة على الهاتف

  function applySidebarState(){
    if(isMobile){
      sidebar.classList.remove('hidden');
      sidebar.classList.toggle('open', sidebarOpen);
      overlay.classList.toggle('show', sidebarOpen);
    } else {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
      sidebar.classList.toggle('hidden', !sidebarOpen);
    }
  }

  function toggleSidebar(){
    sidebarOpen = !sidebarOpen;
    applySidebarState();
  }
  el('sidebarToggle').addEventListener('click', toggleSidebar);
  overlay.addEventListener('click', ()=>{
    sidebarOpen = false;
    applySidebarState();
  });
  window.addEventListener('resize', ()=>{
    const nowMobile = window.innerWidth <= MOBILE_BP;
    if(nowMobile !== isMobile){
      isMobile = nowMobile;
      sidebarOpen = !isMobile; // إعادة ضبط منطقية عند عبور نقطة التحوّل بين الوضعين
    }
    applySidebarState();
  });
  applySidebarState();

  // ==========================================================
  // CLOCK
  // ==========================================================
  function tick(){
    el('statusTime').textContent = new Date().toLocaleTimeString('en-GB', { hour12:false });
  }
  setInterval(tick, 1000); tick();

  // ==========================================================
  // INIT
  // ==========================================================
  buildSidebar();
  showHome();
</script>
</body>
</html>
